{{define "content"}}
<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3">
  {{range .Widgets}}
  <div class="{{ui "widget"}} {{if eq .Size "lg"}}sm:col-span-2 xl:col-span-3{{end}}">
    <div class="mb-3 flex items-center gap-3">
      <span class="{{ui "widget" "icon"}}">
        {{icon .Icon "w-5 h-5"}}
      </span>
      <h2 class="text-sm font-medium text-muted-foreground">{{.Title}}</h2>
    </div>
    {{.Body}}
  </div>
  {{end}}
  {{if not .Widgets}}<p class="text-sm text-muted-foreground">No widgets configured.</p>{{end}}
</div>
{{end}}
