{{define "content"}}
<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3">
  {{range .Widgets}}
  <div class="rounded-lg border border-neutral-200/60 bg-white p-4 shadow-sm sm:p-6 {{if eq .Size "lg"}}sm:col-span-2 xl:col-span-3{{end}}">
    <div class="mb-3 flex items-center gap-3">
      <span class="inline-flex shrink-0 items-center justify-center rounded-lg bg-neutral-100 p-2 text-neutral-900">
        {{icon .Icon "w-5 h-5"}}
      </span>
      <h2 class="text-sm font-medium text-neutral-500">{{.Title}}</h2>
    </div>
    {{.Body}}
  </div>
  {{end}}
  {{if not .Widgets}}<p class="text-sm text-neutral-500">No widgets configured.</p>{{end}}
</div>
{{end}}
