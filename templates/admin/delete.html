{{define "content"}}
<form method="post" class="{{ui "panel" "form"}}">
  <div class="mb-4 flex items-start gap-3">
    <span class="inline-flex shrink-0 items-center justify-center rounded-full bg-destructive/10 p-2 text-destructive">
      {{icon "delete" "w-5 h-5"}}
    </span>
    <p class="mt-1.5 text-sm text-muted-foreground">Are you sure you want to delete this {{.VerboseName}}? This action cannot be undone.</p>
  </div>
  <div class="flex flex-col gap-2 sm:flex-row">
    <button type="submit"
            class="{{ui "button" "destructive"}}">
      {{icon "delete" "w-4 h-4"}} Delete</button>
    <a href="{{.BasePath}}/{{.CurrentSlug}}"
       class="{{ui "button" "outline"}}">
      Cancel</a>
  </div>
</form>
{{end}}
