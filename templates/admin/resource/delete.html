{{define "content"}}
<form method="post" class="{{ui "panel" "form"}}">
  {{template "csrf-field" .CSRFToken}}
  <div class="flex items-start gap-3">
    <span class="inline-flex shrink-0 items-center justify-center rounded-full bg-destructive/10 p-2 text-destructive">
      {{icon "delete" "w-5 h-5"}}
    </span>
    <div class="mt-1.5">
      <p class="{{ui "text" "heading"}}">{{t "Delete «%s»?" .ObjectLabel}}</p>
      <p class="mt-1 text-sm text-muted-foreground">{{t "This action cannot be undone."}}</p>
    </div>
  </div>
  {{template "ui/delete-preview" .Preview}}
  <div class="mt-4 flex flex-col gap-2 sm:flex-row">
    {{if not .Preview.Blocked}}
    <button type="submit" id="delete-confirm" class="{{ui "button" "destructive"}}">
      {{icon "delete" "w-4 h-4"}} {{t "Delete"}}</button>
    {{end}}
    <a href="{{.BasePath}}/{{.CurrentSlug}}" class="{{ui "button" "outline"}}">{{t "Cancel"}}</a>
  </div>
</form>
{{end}}
