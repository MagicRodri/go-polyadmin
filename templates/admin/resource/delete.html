{{define "content"}}
<form method="post" class="{{ui "panel" "form"}}">
  {{template "csrf-field" .CSRFToken}}
  <div class="mb-4 flex items-start gap-3">
    <span class="inline-flex shrink-0 items-center justify-center rounded-full bg-destructive/10 p-2 text-destructive">
      {{icon "delete" "w-5 h-5"}}
    </span>
    <p class="mt-1.5 text-sm text-muted-foreground">{{t "Are you sure you want to delete this %s? This action cannot be undone." (t .VerboseName)}}</p>
  </div>
  <div class="flex flex-col gap-2 sm:flex-row">
    <button type="submit"
            class="{{ui "button" "destructive"}}">
      {{icon "delete" "w-4 h-4"}} {{t "Delete"}}</button>
    <a href="{{.BasePath}}/{{.CurrentSlug}}"
       class="{{ui "button" "outline"}}">
      {{t "Cancel"}}</a>
  </div>
</form>
{{end}}
