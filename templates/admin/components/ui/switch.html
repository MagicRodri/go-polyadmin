{{/* Switch, ported from shadcn/ui (Radix Switch).

     Mirrors python-polyadmin/.../components/ui/switch.html.

     Radix renders a <button role="switch"> and keeps a hidden input in
     sync so the control still posts. This is a native checkbox instead,
     visually identical: the input is sr-only and the track and thumb
     are its siblings, driven entirely by peer-checked:. That means the
     switch toggles with no JavaScript at all -- an earlier Alpine
     version only degraded to "whatever the server rendered" without it.

     It posts exactly like a checkbox: the field's name with value
     "true" when on, nothing when off. Both the generated form fields
     and the example custom pages read it as `== "true"`, so absent
     reads as false, which is the ordinary HTML convention.

     The generated boolean form field renders this same markup inline
     with its label (see ui/field.html); this wrapper is for custom
     admin pages (docs/routing.md), which want the label and help text
     laid out for them.

     Argument (via `dict`):
       .name      form field name
       .label     visible label text
       .checked   bool, initial state
       .help      optional description under the label */}}
{{define "ui/switch"}}
<div class="mb-4 {{ui "field" "row"}}">
  {{template "ui/switch-control" dict "name" .name "id" (printf "switch-%s" .name) "checked" .checked "disabled" false}}
  <span class="{{ui "field" "row-text"}}">
    <label for="switch-{{.name}}" class="{{ui "label"}}">{{.label}}</label>
    {{if .help}}<p class="{{ui "field" "description"}}">{{.help}}</p>{{end}}
  </span>
</div>
{{end}}

{{/* The control on its own, for callers that lay out their own label --
     which is what the generated boolean field does. */}}
{{define "ui/switch-control"}}
<label class="{{ui "switch"}}">
  <input type="checkbox" id="{{.id}}" name="{{.name}}" value="true" autocomplete="off"
         role="switch" {{if .checked}}checked{{end}} {{if .disabled}}disabled{{end}}
         class="{{ui "switch" "input"}}">
  <span class="{{ui "switch" "track"}}"></span>
  <span class="{{ui "switch" "thumb"}}"></span>
</label>
{{end}}
