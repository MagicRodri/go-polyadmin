{{define "admin/widgets/chart.html"}}
<div class="space-y-2">
  {{range .Series}}
  <div>
    <div class="mb-0.5 flex justify-between text-xs text-neutral-600"><span>{{.Label}}</span><span>{{.Value}}</span></div>
    <div class="h-2 w-full rounded-full bg-neutral-100">
      <div class="h-2 rounded-full bg-neutral-900" style="width: {{.Percent}}%"></div>
    </div>
  </div>
  {{end}}
  {{if not .Series}}<p class="text-sm text-neutral-400">No data.</p>{{end}}
</div>
{{end}}
