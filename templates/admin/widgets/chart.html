{{define "admin/widgets/chart.html"}}
<div class="space-y-2">
  {{range .Series}}
  <div>
    <div class="mb-0.5 flex justify-between text-xs text-muted-foreground"><span>{{.Label}}</span><span>{{.Value}}</span></div>
    <div class="{{ui "widget" "bar-track"}}">
      <div class="{{ui "widget" "bar-fill"}}" style="width: {{.Percent}}%"></div>
    </div>
  </div>
  {{end}}
  {{if not .Series}}<p class="text-sm text-muted-foreground">No data.</p>{{end}}
</div>
{{end}}
