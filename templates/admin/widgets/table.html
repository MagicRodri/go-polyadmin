{{define "admin/widgets/table.html"}}
<div class="overflow-x-auto">
<table class="min-w-full text-sm">
  <thead>
    <tr class="border-b border-border">{{range .Columns}}<th class="{{ui "table" "th-compact"}}">{{.}}</th>{{end}}</tr>
  </thead>
  <tbody class="divide-y divide-border">
    {{$columns := .Columns}}
    {{range .Rows}}
    {{$row := .}}
    <tr class="hover:bg-muted/50">{{range $columns}}<td class="px-2 py-1.5 text-foreground whitespace-nowrap">{{index $row .}}</td>{{end}}</tr>
    {{end}}
  </tbody>
</table>
{{if not .Rows}}<p class="text-sm text-muted-foreground">No data.</p>{{end}}
</div>
{{end}}
