{{define "admin/widgets/table.html"}}
<div class="overflow-x-auto">
<table class="min-w-full text-sm">
  <thead>
    <tr class="bg-neutral-50">{{range .Columns}}<th class="px-2 py-1.5 text-left text-xs font-medium uppercase tracking-wide text-neutral-500 whitespace-nowrap">{{.}}</th>{{end}}</tr>
  </thead>
  <tbody class="divide-y divide-neutral-100">
    {{$columns := .Columns}}
    {{range .Rows}}
    {{$row := .}}
    <tr class="hover:bg-neutral-50">{{range $columns}}<td class="px-2 py-1.5 text-neutral-700 whitespace-nowrap">{{index $row .}}</td>{{end}}</tr>
    {{end}}
  </tbody>
</table>
{{if not .Rows}}<p class="text-sm text-neutral-400">No data.</p>{{end}}
</div>
{{end}}
