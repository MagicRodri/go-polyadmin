{{define "admin/widgets/progress.html"}}
<div class="mb-1 flex justify-between text-sm text-muted-foreground">
  <span>{{.Value}} / {{.Target}}</span><span>{{.Percent}}%</span>
</div>
<div class="{{ui "widget" "bar-track"}}">
  <div class="{{ui "widget" "bar-fill"}}" style="width: {{.Percent}}%"></div>
</div>
{{end}}
