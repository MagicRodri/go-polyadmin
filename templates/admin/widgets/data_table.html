{{define "admin/widgets/data_table.html"}}
<table class="min-w-full text-sm" data-table="{{.Key}}">
  <thead class="sticky top-0 z-10 bg-card">
    <tr class="border-b border-border">
      {{range .Columns}}<th class="{{ui "table" "th-compact"}}{{if eq .Align "end"}} text-right{{end}}">{{t .Label}}</th>{{end}}
    </tr>
  </thead>
  <tbody class="divide-y divide-border">
    {{if .Totals}}
    <tr class="font-semibold" data-totals>
      {{range .Totals}}<td class="px-2 py-1.5 break-words{{if eq .Align "end"}} text-right{{end}}">{{.HTML}}</td>{{end}}
    </tr>
    {{end}}
    {{template "admin/widgets/data_table_rows.html" .}}
  </tbody>
</table>
{{if .Footer}}<p class="mt-2 {{ui "text" "muted"}}" data-table-footer>{{.Footer}}</p>{{end}}
{{end}}
